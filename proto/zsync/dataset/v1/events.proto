syntax = "proto3";

package zsync.dataset.v1;

// Network identifies the source chain. V1 intentionally supports Testnet only,
// while retaining an enum so accidental cross-network consumption is fatal.
enum Network {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_ZCASH_TESTNET = 1;
}

message EventEnvelope {
  uint32 schema_major = 1;
  uint32 schema_minor = 2;
  string dataset_id = 3;
  Network network = 4;
  uint64 sequence = 5;
  int64 recorded_at_unix_nanos = 6;

  oneof event {
    SourceStarted source_started = 20;
    SourceStopped source_stopped = 21;
    SourceUnavailable source_unavailable = 22;
    SourceRecovered source_recovered = 23;
    BlockObserved block_observed = 24;
    BlockConnected block_connected = 25;
    BlockDisconnected block_disconnected = 26;
    TipChanged tip_changed = 27;
    DatasetFinalized dataset_finalized = 28;
  }

  // SHA-256 over the deterministic serialization of the selected event message.
  bytes payload_sha256 = 100;
}

message BlockRef {
  uint64 height = 1;
  bytes hash = 2;
  bytes parent_hash = 3;
  int64 block_time_unix_seconds = 4;
  string content_key = 5;
  bytes raw_payload_sha256 = 6;
  uint64 raw_payload_length = 7;
}

message ChainTip {
  uint64 height = 1;
  bytes hash = 2;
}

message SourceStarted {
  string session_id = 1;
  string recorder_version = 2;
  string zebra_endpoint_id = 3;
}

message SourceStopped {
  string session_id = 1;
  string reason = 2;
}

enum SourceFailureCategory {
  SOURCE_FAILURE_CATEGORY_UNSPECIFIED = 0;
  SOURCE_FAILURE_CATEGORY_CONNECTION = 1;
  SOURCE_FAILURE_CATEGORY_TIMEOUT = 2;
  SOURCE_FAILURE_CATEGORY_RATE_LIMIT = 3;
  SOURCE_FAILURE_CATEGORY_INVALID_RESPONSE = 4;
  SOURCE_FAILURE_CATEGORY_SOURCE_NOT_READY = 5;
}

message SourceUnavailable {
  SourceFailureCategory category = 1;
  string diagnostic = 2;
}

message SourceRecovered {
  int64 unavailable_since_unix_nanos = 1;
}

message BlockObserved {
  BlockRef block = 1;
}

message BlockConnected {
  BlockRef block = 1;
}

message BlockDisconnected {
  BlockRef block = 1;
}

message TipChanged {
  ChainTip tip = 1;
}

message DatasetFinalized {
  uint64 final_sequence = 1;
  ChainTip final_tip = 2;
  bytes event_log_sha256 = 3;
  bytes block_set_sha256 = 4;
  uint64 block_object_count = 5;
}
